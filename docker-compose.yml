services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ids
      POSTGRES_USER: ids
      POSTGRES_PASSWORD: ids
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.example

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.example

  worker:
    build: .
    command: celery -A config worker -l info -c 1
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      CELERY_TASK_SOFT_TIME_LIMIT: 270
      CELERY_TASK_TIME_LIMIT: 300
      CELERY_TASK_ACKS_LATE: 'False'
